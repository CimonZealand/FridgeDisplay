<!DOCTYPE html>
<html lang="da">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
	<title>Køleskabsovervågning</title>
 
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      	rel="stylesheet">
 
	<!-- Vue 3 -->
	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
 
	<!-- Axios -->
	<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
 
<div id="app">

    <header>
        <h1>Køleskabsovervågning</h1>
        <button>Administration</button>
    </header>

    <main>
        <h2>Køleskabsovervågning</h2>

        <div class="measurement-container">

            <section class="measurement-card">
                <h2>Temperatur</h2>
                <p class="measurement-value">{{ temperature }} °C</p>
            </section>

            <section class="measurement-card">
                <h2>Luftfugtighed</h2>
                <p class="measurement-value">{{ humidity }} %</p>
            </section>

        </div>
    </main>

</div>
 
	<!-- Bootstrap JavaScript (valgfrit) -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
 
	<!-- Din egen JavaScript-fil -->
	<script src="index.js"></script>
 
</body>
</html>
